<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#6255e7" />
    <title>Simkl TV — Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; color: #17191f; background: #f4f5f8; }
      main { width: min(100%, 420px); padding: 32px; border-radius: 24px; text-align: center; background: white; box-shadow: 0 24px 70px rgba(29,31,46,.13); }
      .mark { width: 58px; height: 58px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 18px; color: white; background: linear-gradient(145deg,#7569f3,#4f42ce); font-size: 28px; }
      h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: -.04em; }
      p { margin: 0 0 22px; color: #6f7480; line-height: 1.55; }
      button { min-height: 46px; padding: 0 20px; border: 0; border-radius: 13px; color: white; background: #6255e7; font: inherit; font-weight: 750; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { color: #f2f3f7; background: #0d0f13; } main { background: #17191f; } p { color: #a2a6b1; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">◫</div>
      <h1>You’re offline</h1>
      <p>Open the app from its usual address to see the latest TV library saved on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
